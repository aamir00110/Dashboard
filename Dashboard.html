<script>
  function getCurrentUser() {
    if (typeof apex !== 'undefined' && apex.env && apex.env.APP_USER) {
      return apex.env.APP_USER;
    }
    var raw = '&APP_USER.';
    if (raw === '&' + 'APP_USER.') return 'AMIR'; // fallback for local test
    return raw;
  }

  var allowedUsers = ['ZAIN', 'AMIR', 'SABIR', 'NADEEM', 'SHAHID', 'CIO'];

  function navigateTo(url) {
    var currentUser = getCurrentUser().trim().toUpperCase();
    var isAuthorized = allowedUsers.some(function(u) {
      return u.toUpperCase() === currentUser;
    });
    if (isAuthorized) {
      window.location.href = url;
    } else {
      alert('⛔ Access Denied!\nUser "' + currentUser + '" is not authorized.');
    }
  }

  /* ✅ KEY FIX: Force parent APEX region containers to be transparent & no overflow */
  (function fixApexRegion() {
    var el = document.body;
    while (el && el !== document.documentElement) {
      el.style.background   = 'transparent';
      el.style.overflow     = 'visible';
      el.style.padding      = '0';
      el.style.margin       = '0';
      el.style.border       = 'none';
      el.style.boxShadow    = 'none';
      el.style.borderRadius = '0';
      el = el.parentElement;
    }
  })();
</script>
